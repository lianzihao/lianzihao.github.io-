<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 第三空间 · 虚拟叙事酒吧</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel-bg: rgba(20, 20, 40, 0.92);
            --text: #e0d5c1;
            --accent: #f0a060;
            --accent2: #6ec6ca;
            --input-bg: rgba(30, 30, 55, 0.85);
            --border: rgba(255, 255, 255, 0.12);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
            --radius: 16px;
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: var(--font);
            background: var(--bg);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: grab;
        }
        body:active {
            cursor: grabbing;
        }
        body.pointer-cursor {
            cursor: pointer;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        canvas {
            display: block;
        }

        /* 底部UI面板 */
        #ui-panel {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            pointer-events: none;
            width: 90%;
            max-width: 600px;
        }
        #ui-panel>* {
            pointer-events: auto;
        }

        /* 聊天消息浮动显示区 */
        #chat-bubbles-area {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 8;
            display: flex;
            flex-direction: column-reverse;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            width: 90%;
            max-width: 500px;
        }
        .floating-bubble {
            background: var(--panel-bg);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            animation: bubbleIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                bubbleFade 6s ease-in-out forwards;
            max-width: 100%;
            text-align: center;
            box-shadow: var(--shadow);
            pointer-events: none;
        }
        .floating-bubble .bubble-author {
            font-weight: 700;
            font-size: 11px;
            opacity: 0.8;
            margin-bottom: 2px;
        }
        @keyframes bubbleIn {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes bubbleFade {
            0%,
            70% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translateY(-30px);
            }
        }

        /* 输入行 */
        #input-row {
            display: flex;
            gap: 10px;
            width: 100%;
            background: var(--panel-bg);
            border-radius: 28px;
            padding: 8px 8px 8px 20px;
            border: 1px solid var(--border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow);
            align-items: center;
        }
        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 15px;
            font-family: var(--font);
            padding: 6px 0;
            min-width: 0;
        }
        #chat-input::placeholder {
            color: rgba(224, 213, 193, 0.45);
        }
        #send-btn {
            background: var(--accent);
            border: none;
            color: #1a1a2e;
            font-weight: 700;
            padding: 10px 22px;
            border-radius: 22px;
            cursor: pointer;
            font-size: 14px;
            font-family: var(--font);
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.5px;
        }
        #send-btn:hover {
            background: #f8b870;
            transform: scale(1.03);
            box-shadow: 0 4px 18px rgba(240, 160, 96, 0.5);
        }
        #send-btn:active {
            transform: scale(0.96);
        }

        /* 在线状态指示器 */
        #online-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text);
            opacity: 0.7;
            background: var(--panel-bg);
            padding: 6px 14px;
            border-radius: 16px;
            border: 1px solid var(--border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            pointer-events: none;
        }
        #online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse-dot 2s infinite;
        }
        @keyframes pulse-dot {
            0%,
            100% {
                box-shadow: 0 0 6px #4ade80;
            }
            50% {
                box-shadow: 0 0 16px #4ade80, 0 0 28px rgba(74, 222, 128, 0.5);
            }
        }

        /* 名字输入弹窗 */
        #name-modal {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 25, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        #name-modal.hidden {
            display: none;
        }
        #name-card {
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 32px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
        #name-card h2 {
            color: var(--accent);
            font-size: 22px;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        #name-card p {
            color: var(--text);
            opacity: 0.65;
            font-size: 13px;
            margin-bottom: 18px;
        }
        #name-card input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 24px;
            border: 1px solid var(--border);
            background: var(--input-bg);
            color: var(--text);
            font-size: 15px;
            font-family: var(--font);
            outline: none;
            text-align: center;
            margin-bottom: 14px;
            transition: border-color 0.3s;
        }
        #name-card input:focus {
            border-color: var(--accent);
        }
        #name-card button {
            background: var(--accent);
            border: none;
            color: #1a1a2e;
            font-weight: 700;
            padding: 11px 32px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-family: var(--font);
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }
        #name-card button:hover {
            background: #f8b870;
            transform: scale(1.04);
            box-shadow: 0 4px 20px rgba(240, 160, 96, 0.5);
        }

        /* 提示标签 */
        #hint-tag {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9;
            font-size: 12px;
            color: var(--text);
            opacity: 0.6;
            pointer-events: none;
            background: var(--panel-bg);
            padding: 6px 16px;
            border-radius: 14px;
            border: 1px solid var(--border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.8s;
            letter-spacing: 0.3px;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            #input-row {
                padding: 6px 6px 6px 14px;
                gap: 6px;
                border-radius: 22px;
            }
            #chat-input {
                font-size: 14px;
            }
            #send-btn {
                padding: 8px 16px;
                font-size: 13px;
                border-radius: 18px;
            }
            #hint-tag {
                font-size: 10px;
                top: 10px;
                padding: 4px 10px;
            }
            #chat-bubbles-area {
                bottom: 120px;
            }
        }
    </style>
</head>
<body>

    <!-- 画布容器 -->
    <div id="canvas-container"></div>

    <!-- 操作提示 -->
    <div id="hint-tag">🖱️ 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放 &nbsp;|&nbsp; WASD 移动你的小球 &nbsp;|&nbsp; 打开多个标签页体验多人</div>

    <!-- 聊天气泡浮动区 -->
    <div id="chat-bubbles-area"></div>

    <!-- 底部UI -->
    <div id="ui-panel">
        <div id="online-indicator">
            <span id="online-dot"></span>
            <span id="online-count">1 人在空间中</span>
        </div>
        <div id="input-row">
            <input type="text" id="chat-input" placeholder="说点什么吧..." maxlength="80" />
            <button id="send-btn">发送</button>
        </div>
    </div>

    <!-- 名字输入弹窗 -->
    <div id="name-modal">
        <div id="name-card">
            <h2>🍸 欢迎来到第三空间</h2>
            <p>一个虚拟叙事酒吧 · 你的小球代表你</p>
            <input type="text" id="name-input" placeholder="输入你的昵称" maxlength="12" />
            <br />
            <button id="name-confirm">进入空间</button>
        </div>
    </div>

    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== DOM元素 ====================
        const container = document.getElementById('canvas-container');
        const chatInput = document.getElementById('chat-input');
        const sendBtn = document.getElementById('send-btn');
        const onlineCountEl = document.getElementById('online-count');
        const bubblesArea = document.getElementById('chat-bubbles-area');
        const hintTag = document.getElementById('hint-tag');
        const nameModal = document.getElementById('name-modal');
        const nameInput = document.getElementById('name-input');
        const nameConfirmBtn = document.getElementById('name-confirm');

        // ==================== 全局状态 ====================
        let myUserId = generateId();
        let myUserName = '';
        let myColor = '';
        let gameStarted = false;

        // ==================== Three.js 初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#1a1a2e');
        scene.fog = new THREE.Fog('#1a1a2e', 8, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.5, 60);
        camera.position.set(8, 10, 10);
        camera.lookAt(0, 0, -0.5);

        // OrbitControls - 鼠标旋转/缩放
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, -0.5);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 5;
        controls.maxDistance = 20;
        controls.maxPolarAngle = Math.PI * 0.55;
        controls.minPolarAngle = Math.PI * 0.2;
        controls.update();
        // 限制缩放时不会太近/太远
        controls.mouseButtons = {
            LEFT: THREE.MOUSE.ROTATE,
            MIDDLE: THREE.MOUSE.PAN,
            RIGHT: THREE.MOUSE.PAN
        };
        controls.touches = {
            ONE: THREE.TOUCH.ROTATE,
            TWO: THREE.TOUCH.DOLLY_PAN
        };

        // ==================== 光照系统 ====================
        // 环境光 - 模拟全局照明
        const ambientLight = new THREE.AmbientLight('#3a3050', 1.8);
        scene.add(ambientLight);

        // 半球光 - 模拟天空/地面
        const hemiLight = new THREE.HemisphereLight('#8899cc', '#443322', 0.7);
        scene.add(hemiLight);

        // 主吊灯光源 - 暖色点光，投射阴影
        const mainLight = new THREE.PointLight('#ffd4a8', 40, 12, 1.5);
        mainLight.position.set(0, 4.5, -1);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 1024;
        mainLight.shadow.mapSize.height = 1024;
        mainLight.shadow.camera.near = 0.3;
        mainLight.shadow.camera.far = 25;
        mainLight.shadow.bias = -0.0003;
        mainLight.shadow.normalBias = 0.02;
        scene.add(mainLight);

        // 辅助暖光 - 吧台上方
        const barLight1 = new THREE.PointLight('#ffbb77', 15, 6, 2);
        barLight1.position.set(-2.5, 2.8, -3.5);
        scene.add(barLight1);

        const barLight2 = new THREE.PointLight('#ffbb77', 15, 6, 2);
        barLight2.position.set(2.5, 2.8, -3.5);
        scene.add(barLight2);

        // 角落暖光
        const cornerLight1 = new THREE.PointLight('#ff9966', 8, 5, 2.5);
        cornerLight1.position.set(-5, 1.8, 3);
        scene.add(cornerLight1);

        const cornerLight2 = new THREE.PointLight('#ff9966', 8, 5, 2.5);
        cornerLight2.position.set(5, 1.8, 3);
        scene.add(cornerLight2);

        // 微弱的蓝色补光（模拟窗外月光）
        const moonLight = new THREE.PointLight('#8899cc', 6, 10, 3);
        moonLight.position.set(0, 3, 6);
        scene.add(moonLight);

        // ==================== 材质工厂 ====================
        function createCanvasTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, width, height);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.colorSpace = THREE.SRGBColorSpace;
            tex.minFilter = THREE.LinearMipmapLinearFilter;
            tex.magFilter = THREE.LinearFilter;
            tex.generateMipmaps = true;
            return tex;
        }

        // 木地板纹理
        const floorTexture = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#5c3a28';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 40; i++) {
                const y = (i / 40) * h;
                ctx.strokeStyle = `rgba(0,0,0,${0.08 + Math.random() * 0.12})`;
                ctx.lineWidth = 1.5 + Math.random() * 2;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y + (Math.random() - 0.5) * 8);
                ctx.stroke();
                // 细微竖线
                if (Math.random() < 0.4) {
                    const x = Math.random() * w;
                    ctx.strokeStyle = `rgba(0,0,0,${0.03 + Math.random() * 0.05})`;
                    ctx.lineWidth = 0.5;
                    ctx.beginPath();
                    ctx.moveTo(x, y - 6);
                    ctx.lineTo(x + (Math.random() - 0.5) * 20, y + 10);
                    ctx.stroke();
                }
            }
            // 柔和光斑
            for (let i = 0; i < 15; i++) {
                const gx = Math.random() * w;
                const gy = Math.random() * h;
                const grd = ctx.createRadialGradient(gx, gy, 0, gx, gy, 40 + Math.random() * 60);
                grd.addColorStop(0, 'rgba(255,220,180,0.06)');
                grd.addColorStop(1, 'rgba(255,220,180,0)');
                ctx.fillStyle = grd;
                ctx.fillRect(gx - 80, gy - 80, 160, 160);
            }
        });
        floorTexture.repeat.set(2, 1.5);
        const floorMaterial = new THREE.MeshStandardMaterial({
            map: floorTexture,
            roughness: 0.55,
            metalness: 0.02,
            color: '#c8a882',
        });

        // 吧台深木纹
        const barWoodTexture = createCanvasTexture(256, 128, (ctx, w, h) => {
            ctx.fillStyle = '#3e2216';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 25; i++) {
                const y = (i / 25) * h;
                ctx.strokeStyle = `rgba(0,0,0,${0.1 + Math.random() * 0.15})`;
                ctx.lineWidth = 2 + Math.random() * 3;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(w, y + (Math.random() - 0.5) * 4);
                ctx.stroke();
            }
        });
        barWoodTexture.repeat.set(2, 1);
        const barWoodMaterial = new THREE.MeshStandardMaterial({
            map: barWoodTexture,
            roughness: 0.4,
            metalness: 0.05,
            color: '#6b3a2a',
        });

        // 普通暖色材质
        const warmWallMaterial = new THREE.MeshStandardMaterial({
            color: '#c4956b',
            roughness: 0.7,
            metalness: 0.03,
        });

        const darkMetalMaterial = new THREE.MeshStandardMaterial({
            color: '#3a3a3a',
            roughness: 0.3,
            metalness: 0.7,
        });

        // ==================== 场景构建 ====================
        // 地板
        const floor = new THREE.Mesh(
            new THREE.PlaneGeometry(14, 10, 1, 1),
            floorMaterial
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -0.05;
        floor.receiveShadow = true;
        floor.name = 'floor';
        scene.add(floor);

        // 地板边缘微微发光的边框（凹槽）
        const edgeGeom = new THREE.TorusGeometry(0.08, 0.03, 8, 4);
        const edgeMaterial = new THREE.MeshStandardMaterial({
            color: '#d4a870',
            roughness: 0.25,
            metalness: 0.6,
            emissive: '#2a1a0a',
            emissiveIntensity: 0.3,
        });
        // 在地板四周放置边框条（简化：四根细条）
        function addFloorEdge(x, z, rotY) {
            const bar = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.04, 0.04), edgeMaterial);
            bar.position.set(x, 0.01, z);
            bar.rotation.y = rotY;
            bar.receiveShadow = true;
            bar.castShadow = true;
            scene.add(bar);
        }
        // 前后边
        for (let i = -6.8; i <= 6.8; i += 0.3) {
            addFloorEdge(i, -4.95, 0);
            addFloorEdge(i, 4.95, 0);
        }
        // 左右边
        for (let i = -4.8; i <= 4.8; i += 0.3) {
            addFloorEdge(-6.95, i, Math.PI / 2);
            addFloorEdge(6.95, i, Math.PI / 2);
        }

        // ==================== 吧台区域 ====================
        const barGroup = new THREE.Group();
        // 吧台主体
        const barTop = new THREE.Mesh(
            new THREE.BoxGeometry(6, 0.22, 1.2),
            barWoodMaterial
        );
        barTop.position.set(0, 1.05, -3.3);
        barTop.castShadow = true;
        barTop.receiveShadow = true;
        barGroup.add(barTop);

        // 吧台前面板
        const barFront = new THREE.Mesh(
            new THREE.BoxGeometry(5.8, 0.9, 0.15),
            new THREE.MeshStandardMaterial({ color: '#4a2a18', roughness: 0.35, metalness: 0.1 })
        );
        barFront.position.set(0, 0.5, -2.72);
        barFront.castShadow = true;
        barFront.receiveShadow = true;
        barGroup.add(barFront);

        // 吧台侧面
        for (let sx of [-2.95, 2.95]) {
            const side = new THREE.Mesh(
                new THREE.BoxGeometry(0.15, 0.9, 1.05),
                new THREE.MeshStandardMaterial({ color: '#4a2a18', roughness: 0.35, metalness: 0.1 })
            );
            side.position.set(sx, 0.5, -3.3);
            side.castShadow = true;
            side.receiveShadow = true;
            barGroup.add(side);
        }

        // 吧台后面酒瓶架
        const shelfGroup = new THREE.Group();
        for (let i = -2.2; i <= 2.2; i += 0.4) {
            const bottleHeight = 0.35 + Math.random() * 0.5;
            const bottleColor = ['#2d5a27', '#4a7a3d', '#6b3a2a', '#8b5a2b', '#1a3a2a', '#5a3020'][
                Math.floor(Math.random() * 6)
            ];
            const bottle = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.07, bottleHeight, 12),
                new THREE.MeshStandardMaterial({
                    color: bottleColor,
                    roughness: 0.2,
                    metalness: 0.15,
                    transparent: true,
                    opacity: 0.85,
                })
            );
            bottle.position.set(i, 1.05 + bottleHeight / 2, -3.9);
            bottle.castShadow = true;
            bottle.receiveShadow = true;
            shelfGroup.add(bottle);

            // 瓶口
            const neck = new THREE.Mesh(
                new THREE.CylinderGeometry(0.03, 0.04, 0.12, 8),
                new THREE.MeshStandardMaterial({ color: '#d4c8a0', roughness: 0.3, metalness: 0.5 })
            );
            neck.position.set(i, 1.05 + bottleHeight + 0.04, -3.9);
            shelfGroup.add(neck);
        }
        barGroup.add(shelfGroup);
        scene.add(barGroup);

        // ==================== 圆桌和凳子 ====================
        const tablePositions = [
            { x: -3.2, z: 0.8 },
            { x: 3.2, z: 0.8 },
            { x: -1.8, z: 2.8 },
            { x: 1.8, z: 2.8 },
            { x: -4.5, z: -1.5 },
            { x: 4.5, z: -1.5 },
        ];

        const tableGroup = new THREE.Group();
        tablePositions.forEach((pos) => {
            const table = new THREE.Group();

            // 桌面
            const top = new THREE.Mesh(
                new THREE.CylinderGeometry(0.55, 0.6, 0.08, 32),
                new THREE.MeshStandardMaterial({ color: '#5c3a28', roughness: 0.35, metalness: 0.08 })
            );
            top.position.y = 0.78;
            top.castShadow = true;
            top.receiveShadow = true;
            table.add(top);

            // 桌腿
            const leg = new THREE.Mesh(
                new THREE.CylinderGeometry(0.06, 0.07, 0.72, 12),
                darkMetalMaterial
            );
            leg.position.y = 0.38;
            leg.castShadow = true;
            leg.receiveShadow = true;
            table.add(leg);

            // 底座

        // 碰撞区域定义
        const collisionZones = [
            // 吧台区域
            { type: 'rect', minX: -3.1, maxX: 3.1, minZ: -4, maxZ: -2.6 },
            // 各桌子
            ...tablePositions.map(p => ({ type: 'circle', cx: p.x, cz: p.z, radius: 0.75 })),

            { type: 'rect', minX: 6.5, maxX: 6.7, minZ: -4.5, maxZ: 4.5 },
        ];

        function checkCollision(x, z, radius = 0.4) {
            for (const zone of collisionZones) {
                if (zone.type === 'circle') {
                    const dx = x - zone.cx;
                    const dz = z - zone.cz;
                    const dist = Math.sqrt(dx * dx + dz * dz);
                    if (dist < zone.radius + radius) return true;
                } else if (zone.type === 'rect') {
                    const closestX = Math.max(zone.minX, Math.min(x, zone.maxX));
                    const closestZ = Math.max(zone.minZ, Math.min(z, zone.maxZ));
                    const dx = x - closestX;
                    const dz = z - closestZ;
                    if (Math.sqrt(dx * dx + dz * dz) < radius) return true;
                }
            }
            return false;
        }

        // 玩家球体类
        class PlayerBall {
            constructor(id, name, color, position) {
                this.id = id;
                this.name = name;
                this.color = color;
                this.targetPosition = position.clone();
                this.currentPosition = position.clone();
                this.chatMessage = null;
                this.chatTimer = 0;

                // 3D球体

                // 头顶名字标签sprite
                this.nameSprite = this.createNameSprite(name, color);
                this.nameSprite.position.y = 0.75;
                this.mesh.add(this.nameSprite);

                // 聊天气泡sprite（初始隐藏）

                // 底部阴影小圆盘

                });

                this.shadowDisc.rotation.x = -Math.PI / 2;
                this.shadowDisc.position.y = -0.36;
                this.mesh.add(this.shadowDisc);

                scene.add(this.mesh);
            }

            createNameSprite(name, colorHex) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // 背景胶囊
                const textWidth = ctx.measureText(name).width;
                ctx.font = 'bold 22px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
                const metrics = ctx.measureText(name);
                const tw = metrics.width;
                const th = 28;
                const cx = canvas.width / 2;
                const cy = canvas.height / 2;
                ctx.fillStyle = 'rgba(20,18,30,0.75)';
                ctx.beginPath();
                ctx.roundRect(cx - tw / 2 - 14, cy - th / 2 - 2, tw + 28, th + 4, 16);
                ctx.fill();
                ctx.strokeStyle = colorHex;
                ctx.lineWidth = 2;
                ctx.stroke();
                // 文字
                ctx.fillStyle = '#ffffff';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(name, cx, cy);

                const tex = new THREE.CanvasTexture(canvas);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.colorSpace = THREE.SRGBColorSpace;
                const spriteMat = new THREE.SpriteMaterial({
                    map: tex,
                    transparent: true,
                    depthWrite: false,
                    depthTest: false,
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(1.8, 0.45, 1);
                return sprite;
            }

            createChatSprite(message) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 96;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const tex = new THREE.CanvasTexture(canvas);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.colorSpace = THREE.SRGBColorSpace;
                const spriteMat = new THREE.SpriteMaterial({
                    map: tex,
                    transparent: true,
                    depthWrite: false,
                    depthTest: false,
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(3, 0.6, 1);
                return sprite;
            }

            updateChatSprite(message) {
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 96;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = 'rgba(0,0,0,0)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (message) {
                    ctx.font = 'bold 20px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
                    const metrics = ctx.measureText(message);
                    const tw = metrics.width;
                    const th = 26;
                    const cx = canvas.width / 2;
                    const cy = canvas.height / 2;
                    // 背景
                    ctx.fillStyle = 'rgba(30,25,45,0.85)';
                    ctx.beginPath();
                    ctx.roundRect(cx - tw / 2 - 16, cy - th / 2 - 4, tw + 32, th + 8, 18);
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    // 文字
                    ctx.fillStyle = '#ffffff';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(message, cx, cy);
                }

                const tex = new THREE.CanvasTexture(canvas);
                tex.minFilter = THREE.LinearFilter;
                tex.magFilter = THREE.LinearFilter;
                tex.colorSpace = THREE.SRGBColorSpace;
                this.chatSprite.material.map?.dispose();
                this.chatSprite.material.map = tex;
                this.chatSprite.material.needsUpdate = true;
                this.chatSprite.visible = !!message;
            }

            setChatMessage(msg) {
                this.chatMessage = msg;
                this.chatTimer = msg ? 6.0 : 0;
                this.updateChatSprite(msg);
            }

            update(dt) {
                // 平滑移动到目标位置
                const lerpFactor = 1 - Math.exp(-12 * dt);
                this.currentPosition.lerp(this.targetPosition, lerpFactor);
                this.mesh.position.copy(this.currentPosition);
                // 更新阴影圆盘位置（保持在地板上）
                this.shadowDisc.position.y = -this.currentPosition.y - 0.34;

                // 球体轻微弹跳动画
                const bounce = Math.sin(Date.now() * 0.004 + this.id.charCodeAt(0) || 0) * 0.04;
                this.mesh.position.y += bounce;
                this.ring.rotation.z += dt * 1.2;

                // 聊天气泡计时
                if (this.chatTimer > 0) {
                    this.chatTimer -= dt;
                    if (this.chatTimer <= 0) {
                        this.setChatMessage(null);
                    }
                }

                this.lastUpdateTime = Date.now();
            }

            setTargetPosition(pos) {
                this.targetPosition.copy(pos);
                this.lastUpdateTime = Date.now();
            }

            remove() {
                if (this.mesh) {
                    this.mesh.traverse((child) => {
                        if (child.material) {
                            if (child.material.map) child.material.map.dispose();
                            child.material.dispose();
                        }
                        if (child.geometry) child.geometry.dispose();
                    });
                    scene.remove(this.mesh);
                }
            }

        // ==================== BroadcastChannel 多人同步 ====================
        const channel = new BroadcastChannel('virtual-bar-third-place');

        function broadcast(data) {
            try {
                channel.postMessage({ ...data, senderId: myUserId });
            } catch (e) {
                // 忽略发送错误
            }
        }

        channel.onmessage = (event) => {
            const data = event.data;
            if (!data || data.senderId === myUserId) return;

            switch (data.type) {
                case 'join':
                    // 新用户加入
                    if (!remotePlayers.has(data.id)) {
                        const pos = new THREE.Vector3(data.position.x, data.position.y, data.position.z);
                        const rp = new PlayerBall(data.id, data.name, data.color, pos);
                        rp.setTargetPosition(pos);
                        remotePlayers.set(data.id, rp);
                        updateOnlineCount();
                        // 回复自己的信息
                        if (myPlayer) {
                            broadcast({
                                type: 'here',
                                id: myUserId,
                                name: myUserName,
                                color: myColor,
                                position: {
                                    x: myPlayer.targetPosition.x,
                                    y: myPlayer.targetPosition.y,
                                    z: myPlayer.targetPosition.z,
                                },
                            });
                        }
                    }
                    break;

                case 'here':
                    // 已有用户回复
                    if (!remotePlayers.has(data.id) && data.id !== myUserId) {
                        const pos = new THREE.Vector3(data.position.x, data.position.y, data.position.z);
                        const rp = new PlayerBall(data.id, data.name, data.color, pos);
                        rp.setTargetPosition(pos);
                        remotePlayers.set(data.id, rp);
                        updateOnlineCount();
                    }
                    break;

                case 'update':
                    // 位置更新
                    if (remotePlayers.has(data.id)) {
                        const rp = remotePlayers.get(data.id);
                        rp.setTargetPosition(new THREE.Vector3(data.position.x, data.position.y, data.position.z));
                        rp.lastUpdateTime = Date.now();
                    }
                    break;

                case 'chat':
                    // 聊天消息
                    if (remotePlayers.has(data.id)) {
                        const rp = remotePlayers.get(data.id);
                        rp.setChatMessage(data.message);
                        // 同时显示浮动气泡
                        showFloatingBubble(data.name, data.message, data.color);
                    }
                    break;

                case 'leave':
                    // 用户离开
                    if (remotePlayers.has(data.id)) {
                        remotePlayers.get(data.id).remove();
                        remotePlayers.delete(data.id);
                        updateOnlineCount();
                    }
                    break;

                case 'ping':
                    // 心跳响应
                    if (!remotePlayers.has(data.id) && data.id !== myUserId) {
                        const pos = new THREE.Vector3(data.position.x, data.position.y, data.position.z);
                        const rp = new PlayerBall(data.id, data.name, data.color, pos);
                        rp.setTargetPosition(pos);
                        remotePlayers.set(data.id, rp);
                        updateOnlineCount();
                    }
                    break;
            }
        };

        // 定期广播位置

        function broadcastPositionIfNeeded(time) {
            if (!myPlayer) return;
            if (time - lastBroadcastTime < BROADCAST_INTERVAL) return;

            const pos = myPlayer.targetPosition;
            if (
                lastBroadcastPos &&
                Math.abs(pos.x - lastBroadcastPos.x) < 0.02 &&
                Math.abs(pos.z - lastBroadcastPos.z) < 0.02
            ) {
                // 位置没怎么变，每2秒发一次心跳
                if (time - lastBroadcastTime < 2.0) return;
                broadcast({
                    type: 'ping',
                    id: myUserId,
                    name: myUserName,
                    color: myColor,
                    position: { x: pos.x, y: pos.y, z: pos.z },
                });
            } else {
                broadcast({
                    type: 'update',
                    id: myUserId,
                    name: myUserName,
                    color: myColor,
                    position: { x: pos.x, y: pos.y, z: pos.z },
                });
                lastBroadcastPos = { x: pos.x, y: pos.y, z: pos.z };
            }
            lastBroadcastTime = time;
        }

                    remotePlayers.delete(id);

            // 计算射线
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersection = new THREE.Vector3();
            const hit = raycaster.ray.intersectPlane(groundPlane, intersection);
            if (hit) {
                // 限制在场景范围内
                const tx = Math.max(-6.4, Math.min(6.4, intersection.x));
                const tz = Math.max(-4.4, Math.min(4.4, intersection.z));
                if (!checkCollision(tx, tz, 0.45)) {
                    myTargetPosition.set(tx, 0.4, tz);
                    if (myPlayer) myPlayer.setTargetPosition(myTargetPosition.clone());
                }
            }
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 页面关闭时通知离开
        window.addEventListener('beforeunload', () => {
            broadcast({ type: 'leave', id: myUserId });
        });

        // 页面可见性变化时处理
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && myPlayer) {
                // 重新广播存在
                broadcast({
                    type: 'here',
                    id: myUserId,
                    name: myUserName,
                    color: myColor,
                    position: {
                        x: myPlayer.targetPosition.x,
                        y: myPlayer.targetPosition.y,
                        z: myPlayer.targetPosition.z,
                    },
                });
            }
        });

        // ==================== 名字输入处理 ====================
        function startGame() {
            const name = nameInput.value.trim();
            if (!name) {
                nameInput.focus();
                nameInput.style.borderColor = '#ff6b6b';
                setTimeout(() => { nameInput.style.borderColor = 'var(--border)'; }, 800);
                return;
            }
            myUserName = name;
            myColor = playerColors[Math.floor(Math.random() * playerColors.length)];
            nameModal.classList.add('hidden');
            gameStarted = true;
            createMyPlayer();
            updateOnlineCount();
            chatInput.focus();
            // 几秒后淡化提示
            setTimeout(() => {
                hintTag.style.opacity = '0.35';
            }, 8000);
        }

        nameConfirmBtn.addEventListener('click', startGame);
        nameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                startGame();
            }
            e.stopPropagation();
        });

        // 初始显示名字弹窗
        nameModal.classList.remove('hidden');
        nameInput.focus();
        // 随机预填名字
        const funNames = ['旅人', '夜猫子', '星光', '微风', '暖阳', '墨客', '浮云', '归人', '拾光者', '听风者'];
        nameInput.value = funNames[Math.floor(Math.random() * funNames.length)];
        nameInput.select();

        // ==================== 游戏循环 ====================
        const clock = new THREE.Clock();
        let staleCheckTimer = 0;

        function animate(timestamp) {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.15);

            if (gameStarted && myPlayer) {
                // 处理键盘移动
                let moveX = 0;
                let moveZ = 0;
                if (keysPressed['w'] || keysPressed['arrowup']) moveZ -= 1;
                if (keysPressed['s'] || keysPressed['arrowdown']) moveZ += 1;
                if (keysPressed['a'] || keysPressed['arrowleft']) moveX -= 1;
                if (keysPressed['d'] || keysPressed['arrowright']) moveX += 1;

                if (moveX !== 0 || moveZ !== 0) {
                    const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
                    moveX /= len;
                    moveZ /= len;

                    const newX = myTargetPosition.x + moveX * moveSpeed * dt;
                    const newZ = myTargetPosition.z + moveZ * moveSpeed * dt;

                    // 碰撞检测 - 分轴检测以实现滑动
                    const clampedX = Math.max(-6.4, Math.min(6.4, newX));
                    const clampedZ = Math.max(-4.4, Math.min(4.4, newZ));

                    // 先试X轴
                    if (!checkCollision(clampedX, myTargetPosition.z, 0.45)) {
                        myTargetPosition.x = clampedX;
                    }
                    // 再试Z轴
                    if (!checkCollision(myTargetPosition.x, clampedZ, 0.45)) {
                        myTargetPosition.z = clampedZ;
                    }
                    // 如果都碰撞，尝试同时移动（对角线可能滑过）
                    if (
                        checkCollision(myTargetPosition.x, myTargetPosition.z, 0.45) &&
                        !checkCollision(clampedX, clampedZ, 0.45)
                    ) {
                        myTargetPosition.x = clampedX;
                        myTargetPosition.z = clampedZ;
                    }

                    myPlayer.setTargetPosition(myTargetPosition.clone());
                }

                // 广播位置
                broadcastPositionIfNeeded(timestamp);

                // 更新我的玩家
                myPlayer.update(dt);
            }

            // 更新远程玩家
            for (const [, rp] of remotePlayers) {
                rp.update(dt);
            }

            // 定期清理超时玩家
            staleCheckTimer += dt;
            if (staleCheckTimer > 3.0) {
                staleCheckTimer = 0;
                cleanupStalePlayers();
            }

            // 更新粒子
            const posArray = particles.geometry.attributes.position.array;
            const time = timestamp * 0.001;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const pd = particleData[i];
                posArray[i3] = pd.baseX + Math.sin(time * pd.frequency + pd.phase) * pd.amplitude;
                posArray[i3 + 1] += pd.speedY;
                if (posArray[i3 + 1] > 5.5) posArray[i3 + 1] = 0;
                if (posArray[i3 + 1] < 0) posArray[i3 + 1] = 5.5;
                posArray[i3 + 2] = pd.baseZ + Math.cos(time * pd.frequency + pd.phase + 1.3) * pd.amplitude * 0.7;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            // 更新招牌闪烁
            if (signPlane.material.opacity !== undefined) {
                signPlane.material.opacity = 0.85 + Math.sin(time * 1.5) * 0.15;
            }

            // 渲染
            controls.update();
            renderer.render(scene, camera);

            // 更新在线计数
            updateOnlineCount();
        }

        // ==================== 启动 ====================
        // 先开始渲染循环（场景可见，等用户输入名字后开始游戏）
        requestAnimationFrame(animate);

        // ==================== 工具函数 ====================
        function generateId() {
            return 'u_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
        }

        console.log('🍸 欢迎来到「第三空间」虚拟叙事酒吧');
        console.log('💡 提示：打开多个浏览器标签页，可以看到彼此的小球！');
        console.log('🖱️ 鼠标拖拽旋转视角 | 滚轮缩放 | 双击地面移动小球 | WASD移动');
        console.log('👤 你的ID:', myUserId);
    </script>
</body>
</html>
